name: ci

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1
      - run: forge fmt --check
      - run: forge test
      - run: forge snapshot --check

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1
      - run: pipx install slither-analyzer
      - run: slither . --fail-medium --filter-paths "lib/|test/|script/" --exclude-dependencies
